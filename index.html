<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOST HUB — Реестр Экспертов</title>
    <style>
        :root { 
            --tg: #0088cc; 
            --bg: #f1f5f9; 
            --dark: #0f172a; 
            --green: #10b981; 
            --accent-green: #f0fdf4;
            --accent-blue: #eff6ff;
            --accent-purple: #faf5ff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #334155; }
        
        .header { background: var(--dark); color: white; padding: 40px 20px; text-align: center; border-bottom: 4px solid var(--tg); }
        .stats { font-size: 11px; opacity: 0.8; margin-top: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }

        .container { width: 100%; max-width: 550px; margin: 0 auto; padding: 15px; }

        .search-box { background: white; padding: 18px; border-radius: 22px; box-shadow: 0 8px 25px rgba(0,0,0,0.07); margin-top: -40px; margin-bottom: 25px; }
        #search { width: 100%; padding: 16px; border: 2px solid #f1f5f9; border-radius: 14px; font-size: 16px; outline: none; }

        .form-btn { 
            display: block; background: linear-gradient(135deg, #10b981, #059669); color: white; text-decoration: none; text-align: center; 
            padding: 20px; border-radius: 18px; margin-bottom: 30px; font-weight: 800; font-size: 14px; 
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); 
        }

        /* Карточка */
        .card { background: white; border-radius: 30px; padding: 25px; margin-bottom: 25px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        
        .user-info { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: #f1f5f9; overflow: hidden; border: 3px solid #fff; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .niche-title { font-size: 11px; color: var(--tg); font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .name { margin: 0; font-size: 24px; color: var(--dark); font-weight: 900; }

        /* Блоки данных */
        .section { padding: 15px; border-radius: 18px; margin-bottom: 12px; border-left: 5px solid; }
        .section-expert { background: var(--accent-green); border-left-color: #22c55e; }
        .section-resources { background: var(--accent-purple); border-left-color: #a855f7; }
        .section-expect { background: var(--accent-blue); border-left-color: #3b82f6; }

        .label { font-size: 10px; font-weight: 900; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 6px; }
        .text { font-size: 14px; color: #1e293b; line-height: 1.6; margin: 0; font-weight: 500; white-space: pre-wrap; }
        
        .artifacts { margin-top: 10px; font-size: 13px; color: var(--tg); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }

        /* Кнопки */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .btn { padding: 16px; border-radius: 16px; text-decoration: none; text-align: center; font-weight: 900; font-size: 12px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-blue { background: var(--tg); color: white; box-shadow: 0 5px 15px rgba(0, 136, 204, 0.3); }
        .btn-white { background: white; color: var(--tg); border: 2px solid var(--tg); }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; letter-spacing: 1px; font-weight: 900;">BOOST HUB</h2>
    <div id="stats" class="stats">Загрузка данных...</div>
</div>

<div class="container">
    <div class="search-box">
        <input type="text" id="search" placeholder="Найти эксперта, ресурс или кейс...">
    </div>

    <a href="https://t.me/megaboost_hub_bot?start=c1770723416752-ds" target="_blank" class="form-btn">🚀 СОЗДАТЬ/ОБНОВИТЬ АНКЕТУ</a>
    
    <div id="list"></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxs2RwPNY90AXmz8Gb7gRjklQ3mwZMzm7cIQVc3ECruqY0JCT55olLe0lWXH8jgsW5o/exec";
    let experts = [];

    function getValue(obj, keyword) {
        const key = Object.keys(obj).find(k => k.toLowerCase().includes(keyword.toLowerCase()));
        return key ? obj[key] : null;
    }

    async function load() {
        try {
            const res = await fetch(API_URL);
            experts = await res.json();
            render();
        } catch (e) { document.getElementById('stats').innerText = "Ошибка загрузки"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('list');
        container.innerHTML = '';

        const filtered = experts.filter(e => JSON.stringify(e).toLowerCase().includes(q));
        document.getElementById('stats').innerText = `РЕЗИДЕНТОВ: ${experts.length} | НАЙДЕНО: ${filtered.length}`;

        filtered.forEach(e => {
            const name = getValue(e, 'Имя') || "Участник";
            const niche = getValue(e, 'Ниша') || 'ЭКСПЕРТ';
            const benefit = getValue(e, 'Чем могу') || getValue(e, 'Польза') || '—';
            const resources = getValue(e, 'Ресурсы') || '—';
            const artifacts = getValue(e, 'Артефакты') || '';
            const expectations = getValue(e, 'ожидаю') || getValue(e, 'Цель') || '—';
            
            const rawP = (getValue(e, 'Личный') || "").toString().trim();
            const hasP = rawP && rawP.length > 2 && rawP !== "-";
            const rawC = (getValue(e, 'канал') || "").toString().trim();
            const hasC = rawC && rawC.length > 2 && rawC !== "-";
            const chNick = hasC ? rawC.split('/').pop().replace('@', '') : "";

            const photo = getValue(e, 'Фото') || (hasC ? `https://unavatar.io/telegram/${chNick}` : `https://ui-avatars.com/api/?name=${name}&background=0088cc&color=fff`);

            container.innerHTML += `
                <div class="card">
                    <div class="user-info">
                        <div class="avatar"><img src="${photo}" onerror="this.src='https://ui-avatars.com/api/?name=${name}'"></div>
                        <div>
                            <div class="niche-title">${niche}</div>
                            <h3 class="name">${name}</h3>
                        </div>
                    </div>
                    
                    <div class="section section-expert">
                        <span class="label">🎯 Экспертность и продукты:</span>
                        <div class="text">${benefit}</div>
                        ${artifacts ? `<a href="${artifacts}" target="_blank" class="artifacts">🔗 Смотреть артефакты</a>` : ''}
                    </div>

                    <div class="section section-resources">
                        <span class="label">🛠 Мои ресурсы:</span>
                        <div class="text">${resources}</div>
                    </div>
                    
                    <div class="section section-expect">
                        <span class="label">💎 Цель в BOOST:</span>
                        <div class="text">${expectations}</div>
                    </div>

                    <div class="actions">
                        ${hasP ? `<a href="https://t.me/${rawP.replace('@','')}" target="_blank" class="btn btn-blue">🤝 КОЛЛАБА</a>` : `<div class="btn" style="background:#eee;color:#aaa">НЕТ КОНТАКТА</div>`}
                        ${hasC ? `<a href="${rawC.includes('http') ? rawC : 'https://t.me/'+chNick}" target="_blank" class="btn btn-white">В КАНАЛ</a>` : `<div class="btn" style="background:#eee;color:#aaa">НЕТ КАНАЛА</div>`}
                    </div>
                </div>
            `;
        });
    }

    document.getElementById('search').oninput = render;
    load();
</script>

</body>
</html>
